name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Check code formatting (gofmt)
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Berkas berikut belum diformat dengan gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Verify module tidiness
        shell: bash
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod atau go.sum tidak sinkron. Jalankan 'go mod tidy'"
            git status --porcelain go.mod go.sum
            exit 1
          fi

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Run unit tests with race detector & shuffle (Linux)
        if: runner.os == 'Linux'
        run: go test -v -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v -shuffle=on ./...

      - name: Build binary
        run: go build -v ./...
