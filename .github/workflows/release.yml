name: Release

# Rilis dibuat dengan mendorong tag versi: `git push origin v0.1.0`.
# Alur ini TIDAK berjalan pada push biasa ke main — gerbang kualitas harian
# ada di ci.yml.
on:
  push:
    tags: [ 'v*' ]

# gh release create butuh izin tulis.
permissions:
  contents: write

jobs:
  # Gerbang sebelum apa pun dibangun: tag harus menunjuk commit yang sudah masuk
  # main DAN lulus gerbang kualitas. Tanpa ini, `git push origin v1.0.0` pada
  # commit yang belum teruji bisa langsung menerbitkan rilis.
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert the tag points to a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} menunjuk ke ${GITHUB_SHA}, yang BUKAN bagian dari main."
            echo "Rilis hanya boleh dibuat dari commit yang sudah masuk main."
            exit 1
          fi
          echo "OK: ${GITHUB_SHA} ada di main"

      - name: Assert the tag is a plain version tag
        shell: bash
        run: |
          set -euo pipefail
          # Tag ikut masuk ke dalam skrip shell DAN ke dalam berkas Go yang
          # di-generate, jadi bentuknya dibatasi: hanya v<major>.<minor>.<patch>
          # (boleh bersufiks -rc1 / +build). Tanpa batas ini, tag seperti
          # `v1.0.0"; <kode>` bisa menyuntik kode ke berkas Go yang dibangun.
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' tidak berbentuk v<major>.<minor>.<patch>."
            exit 1
          fi
          echo "OK: bentuk tag ${GITHUB_REF_NAME} diterima"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Quality gates
        shell: bash
        run: |
          set -euo pipefail
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Berkas berikut belum diformat dengan gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...
          go test -shuffle=on ./...

  windows:
    name: Windows (.exe)
    needs: [ verify ]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Ensure C toolchain (Windows)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y
          }
          gcc --version

      - name: Install Fyne CLI
        # Disematkan, bukan @latest: perilaku v1.7.3 sudah diverifikasi
        # (pemecahan GOFLAGS pada spasi, penulisan ulang FyneApp.toml), dan
        # rilis harus bisa diulang. Naikkan versinya secara sadar.
        run: go install fyne.io/tools/cmd/fyne@v1.7.3

      - name: Build .exe with embedded icon and metadata
        shell: pwsh
        # Tag dilewatkan lewat env, TIDAK disisipkan ke badan skrip: tag yang
        # mengandung `$()` akan dieksekusi PowerShell sebagai perintah, dan
        # workflow ini punya izin tulis repo.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $ver = $tag.TrimStart('v')

          # Versi disuntik lewat berkas Go, BUKAN lewat GOFLAGS/-ldflags.
          #
          # Sebabnya: `fyne package -os windows` membangun DUA KALI, dan build
          # kedua — yang menimpa .exe — sudah kehilangan GOFLAGS karena Fyne
          # menghapusnya setelah build pertama. Jadi `-X main.version` hilang
          # tanpa error sama sekali (persis yang terjadi di rilis v0.1.0).
          # Berkas di bawah ini ikut ter-compile di kedua build.
          Set-Content -Path "cmd/pilihanmu-picker/version_gen.go" -Encoding utf8NoBOM -Value @(
            "// Code generated by .github/workflows/release.yml; DO NOT EDIT.",
            "package main",
            "",
            "func init() { version = `"$tag`" }",
            ""
          )
          Get-Content "cmd/pilihanmu-picker/version_gen.go"

          $fyne = Join-Path (go env GOPATH) "bin\fyne.exe"

          # FyneApp.toml dan Icon.png dibaca dari direktori ini, dan fyne.syso
          # ditulis ke sini juga — karena itu srcDir = direktori paket main.
          Push-Location cmd/pilihanmu-picker
          & $fyne package -os windows -release `
            --app-id id.web.pilihanmu.picker `
            --app-version $ver `
            --app-build $env:GITHUB_RUN_NUMBER
          $code = $LASTEXITCODE
          Get-ChildItem
          Pop-Location
          if ($code -ne 0) { exit $code }

      - name: Assemble .zip and verify metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ver = ($env:RELEASE_TAG).TrimStart('v')

          # fyne menamai .exe sesuai [Details] Name di FyneApp.toml, jadi cari
          # daripada menebak. Gagal keras kalau jumlahnya bukan satu.
          $exes = @(Get-ChildItem "cmd/pilihanmu-picker/*.exe")
          if ($exes.Count -ne 1) {
            throw "diharapkan tepat 1 .exe di cmd/pilihanmu-picker, ditemukan $($exes.Count)"
          }
          $exe = $exes[0]

          # Bukti metadata benar-benar tertanam: VersionInfo diisi goversioninfo
          # dari --app-version/--app-build, dan ikon disematkan saat build.
          $info = $exe.VersionInfo
          Write-Host "FileVersion=$($info.FileVersion) ProductName=$($info.ProductName)"
          if (-not $info.FileVersion.StartsWith("$ver.")) {
            throw "FileVersion '$($info.FileVersion)' tidak diawali '$ver.'"
          }

          $name = "pilihanmu-picker_${ver}_windows_amd64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName "$stage/$($exe.Name)"
          Copy-Item LICENSE, README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (tar.gz)
    needs: [ verify ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build binary and tarball
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          NAME="pilihanmu-picker_${VER}_linux_amd64"

          # Versi lewat berkas Go, sama persis dengan job Windows — satu
          # mekanisme, satu pagar. Jangan kembali ke `-X main.version`.
          cat > cmd/pilihanmu-picker/version_gen.go <<EOF
          // Code generated by .github/workflows/release.yml; DO NOT EDIT.
          package main

          func init() { version = "${GITHUB_REF_NAME}" }
          EOF

          mkdir -p "dist/${NAME}"
          go build -trimpath -ldflags "-s -w" \
            -o "dist/${NAME}/pilihanmu-picker" ./cmd/pilihanmu-picker
          cp LICENSE README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"

          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-targz
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Verify the version is embedded in both artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          tag_re="${tag//./\\.}"
          tab=$'\t'

          tmp="$(mktemp -d)"
          unzip -q dist/*.zip -d "$tmp/win"
          tar -xzf dist/*.tar.gz -C "$tmp/lin"

          # Membuktikan versi BENAR-BENAR tertanam di biner, bukan sekadar
          # "build-nya sukses". Dua jebakan yang sudah menggigit di sini:
          #
          # 1. `grep -F` gagal-TERBUKA — string tag juga muncul di path modul
          #    dependensi (terukur 24 kecocokan palsu di rilis v0.1.0), jadi
          #    gate hijau walaupun versi tidak tertanam.
          # 2. `grep -Fx` (baris utuh) juga TIDAK sah — Go menyimpan string
          #    berdempetan di rodata, jadi versi kita bisa menempel pada
          #    tetangganya (`…ucs-2 BOM)v0.1.0TMPDIR…`) dan gate justru
          #    MENOLAK build yang benar (terukur: 0).
          #
          # Karena itu: buang dulu bentuk path modul (`@v0.1.0`, `<TAB>v0.1.0`,
          # ` v0.1.0`), lalu syaratkan tag masih tersisa.
          assert_embedded() {
            local file="$1" residue
            residue=$(strings -a "$file" \
              | sed -e "s/@${tag_re}//g" -e "s/${tab}${tag_re}//g" -e "s/ ${tag_re}//g" \
              | grep -cF -- "$tag" || true)
            if [ "${residue:-0}" -lt 1 ]; then
              echo "GAGAL: '${tag}' tidak tertanam di ${file}"
              echo "       kemunculannya hanya sebagai path modul dependensi"
              exit 1
            fi
            echo "OK: '${tag}' tertanam di ${file}"
          }

          assert_embedded "$(find "$tmp/win" -name '*.exe' -type f -print -quit)"
          assert_embedded "$(find "$tmp/lin" -name 'pilihanmu-picker' -type f -print -quit)"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Pilihanmu Picker ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS
